version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: syncroot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: syncroot
      POSTGRES_PASSWORD: syncroot_dev_password
      POSTGRES_DB: syncroot
    ports:
      - "5432:5432"
    volumes:
      - syncroot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncroot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  syncroot_postgres_data:
    driver: local
